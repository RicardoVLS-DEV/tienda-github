name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1) Sintaxis ("compila") + pruebas unitarias en varias versiones de PHP
  tests:
    name: Unit tests · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Obtener carpeta de caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cachear dependencias
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock', '**/composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Revisar sintaxis PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Ejecutar pruebas unitarias
        run: composer test

  # 2) Prueba de humo end-to-end con MySQL real (registro, login y CRUD)
  smoke:
    name: Smoke test (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: tienda
      DB_USER: root
      DB_PASS: root

    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql
          coverage: none

      - name: Crear tablas
        run: mysql -h 127.0.0.1 -uroot -proot < database/schema.sql

      - name: Levantar servidor PHP
        run: |
          php -S 127.0.0.1:8000 -t public > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8000/index.php && exit 0
            sleep 1
          done
          echo "El servidor no respondió"; cat server.log; exit 1

      - name: Ejecutar prueba de humo
        run: BASE_URL=http://127.0.0.1:8000 bash tests/smoke.sh

      - name: Mostrar log del servidor si falló
        if: failure()
        run: cat server.log

  # 3) Análisis estático (no bloquea mientras lo ajustas; quita continue-on-error cuando esté en verde)
  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ejecutar PHPStan
        run: composer stan
